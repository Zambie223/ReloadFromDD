[AccessTransformers]
; The hooks subscribe to protected equipment functions and read protected members (e.g. AFGChainsaw::mFuelClass),
; and refresh the jetpack's cached fuel availability. Needed in release builds, not a development aid.
Friend=(Class="AFGWeapon", FriendClass="FReloadFromDDHooks")
Friend=(Class="AFGEquipment", FriendClass="FReloadFromDDHooks")
Friend=(Class="AFGJetPack", FriendClass="FReloadFromDDHooks")
Friend=(Class="AFGChainsaw", FriendClass="FReloadFromDDHooks")
Friend=(Class="AFGConsumableEquipment", FriendClass="FReloadFromDDHooks")
